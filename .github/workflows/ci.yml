name: CI

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install core and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Check environment
        run: python scripts/doctor.py
      - name: Run tests
        run: python -m pytest -q
      - name: Compile Python sources
        run: python -m compileall -q src pipelines scripts baseline-scripts
      - name: Check shell syntax
        run: bash -n run_gemini_smoke_main.sh run_vllm_server.sh run_vllm_server_2.sh
