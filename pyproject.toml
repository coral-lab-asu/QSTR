[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qstr"
version = "0.1.0"
description = "Knowledge-transfer monorepo for question, SQL, and synthetic-data generation"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "pipelines/cmt2/tests"]
